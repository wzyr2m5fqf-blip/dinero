<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cargando…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script>
// Demo para FLORINDA Coffee House — datos sacados de su ficha de Google Maps.
// ⚠️ PENDIENTE de confirmar con el dueño: horario completo, precios de la carta y WhatsApp/teléfono.
window.NEGOCIO = {
  demo: true, // muestra la franja "versión de demostración"; quitar al entregar
  nombre: "FLORINDA Coffee House",
  tipo: "Cafetería · Caballito",
  eslogan: "Café de especialidad con patio, en el corazón de Caballito",
  descripcion:
    "Tostones, focaccias y pastelería casera en un espacio pensado para quedarse. Vení a desayunar, merendar o trabajar tranquilo en nuestro patio.",

  // Colores tomados de su local: rosa empolvado y verde salvia
  colorPrincipal: "#c2547a",
  colorOscuro: "#2f4a3f",

  // Reemplazar por una foto propia del local (de su Instagram) al entregar
  imagenCabecera:
    "https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1600&q=80",

  whatsapp: "", // sin WhatsApp en la ficha: los botones llevan a Instagram
  telefono: "",
  email: "",
  direccion: "Av. Acoyte 272, C1405 CABA",
  instagram: "florindacoffee",

  textoBoton: "Ver más en Instagram",
  textoBotonFinal: "Seguinos en Instagram",
  tituloFinal: "¿Te esperamos para un café?",
  tituloServicios: "Nuestra carta",

  horario: [
    ["Todos los días", "Desde las 7:30"], // confirmar días y hora de cierre
  ],

  // Platos que mencionan sus clientes en Google; precios a completar con el menú real
  servicios: [
    { nombre: "Tostón de palta", precio: "", detalle: "Palta, huevo, hummus y especias" },
    { nombre: "Focaccias", precio: "", detalle: "Masa casera, rellenos de estación" },
    { nombre: "Café de especialidad", precio: "", detalle: "Espresso, flat white, latte y más" },
    { nombre: "Pastelería", precio: "", detalle: "Cheesecake, red velvet, croissants" },
    { nombre: "Waffles", precio: "", detalle: "Con frutas, cremas y toppings" },
    { nombre: "Licuados y bebidas frías", precio: "", detalle: "Frutales, frescos y de colores" },
  ],

  // Fragmentos reales del resumen de opiniones de Google
  resenas: [
    { autor: "", texto: "Los tostones de palta, huevo, humus y especias riquísimo!!" },
    { autor: "", texto: "Tienen un patio muy cómodo." },
  ],
  notaGoogle: "4,6 · más de 2.100 opiniones",
};

</script>
  <style>
    :root { --c: #b5476b; --d: #2b1b22; --bg: #fffaf8; --t: #2a2a2a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; color: var(--t); background: var(--bg); line-height: 1.6; }
    a { color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

    nav { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #eee; }
    nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 64px; }
    nav strong { font-size: 1.15rem; }
    nav .links a { margin-left: 22px; text-decoration: none; font-weight: 600; font-size: .95rem; }

    .hero { min-height: 82vh; display: flex; align-items: center; color: #fff; background-size: cover; background-position: center; position: relative; }
    .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.72), rgba(0,0,0,.25)); }
    .hero .wrap { position: relative; }
    .hero small { text-transform: uppercase; letter-spacing: .15em; font-weight: 600; opacity: .9; }
    .hero h1 { font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.1; margin: 12px 0 18px; max-width: 14ch; font-weight: 800; }
    .hero p { max-width: 46ch; font-size: 1.1rem; opacity: .95; }
    .btns { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 14px 26px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .btn-main { background: var(--c); color: #fff; }
    .btn-ghost { border: 2px solid #fff; color: #fff; }
    .stars { margin-top: 22px; font-weight: 600; }

    section { padding: 80px 0; }
    h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin-bottom: 30px; color: var(--d); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
    .card .row { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 1.05rem; }
    .card .price { color: var(--c); white-space: nowrap; }
    .card p { color: #666; font-size: .95rem; margin-top: 6px; }
    .quote { font-style: italic; }
    .quote b { display: block; margin-top: 12px; font-style: normal; color: var(--c); }

    .alt { background: #fff; }
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 10px 0; border-bottom: 1px solid #eee; }
    td:last-child { text-align: right; font-weight: 600; }
    iframe { width: 100%; height: 320px; border: 0; border-radius: 16px; }

    .cta { background: var(--d); color: #fff; text-align: center; }
    .cta h2 { color: #fff; }
    footer { padding: 30px 0; text-align: center; font-size: .85rem; color: #888; }

    [hidden] { display: none !important; }
    .demo { background: #111; color: #fff; text-align: center; font-size: .8rem; padding: 6px 12px; }
    .wa { position: fixed; right: 20px; bottom: 20px; width: 60px; height: 60px; border-radius: 50%; background: #25d366; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 20; }
    .wa svg { width: 32px; fill: #fff; }

    @media (max-width: 720px) {
      nav .links { display: none; }
      .info { grid-template-columns: 1fr; }
      section { padding: 60px 0; }
    }
  </style>
</head>
<body>
  <div class="demo" id="demo" hidden>Propuesta de diseño · versión de demostración</div>
  <nav><div class="wrap"><strong id="n-nombre"></strong>
    <div class="links"><a href="#servicios" id="n-serv">Servicios</a><a href="#opiniones">Opiniones</a><a href="#contacto">Contacto</a></div>
  </div></nav>

  <header class="hero" id="hero"><div class="wrap">
    <small id="h-tipo"></small>
    <h1 id="h-eslogan"></h1>
    <p id="h-desc"></p>
    <div class="btns">
      <a class="btn btn-main" id="b-cita" target="_blank" rel="noopener"></a>
      <a class="btn btn-ghost" id="b-tel">Llamar</a>
    </div>
    <div class="stars" id="h-stars"></div>
  </div></header>

  <section id="servicios"><div class="wrap">
    <h2 id="t-serv"></h2>
    <div class="grid" id="l-servicios"></div>
  </div></section>

  <section class="alt" id="opiniones"><div class="wrap">
    <h2>Lo que dicen nuestros clientes</h2>
    <div class="grid" id="l-resenas"></div>
  </div></section>

  <section id="contacto"><div class="wrap info">
    <div>
      <h2>Horario</h2>
      <table id="l-horario"></table>
      <p style="margin-top:24px"><b>Dirección:</b> <span id="c-dir"></span></p>
      <p id="p-tel"><b>Teléfono:</b> <a id="c-tel"></a></p>
      <p id="c-extra"></p>
    </div>
    <iframe id="mapa" loading="lazy" title="Mapa"></iframe>
  </div></section>

  <section class="cta"><div class="wrap">
    <h2 id="t-cta"></h2>
    <a class="btn btn-main" id="b-cita2" target="_blank" rel="noopener"></a>
  </div></section>

  <footer id="pie"></footer>

  <a class="wa" id="b-wa" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-1-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6.3-.5c.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.7 5 2.8 1.1 3.4.9 4 .8.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5l-.6-.4z"/></svg>
  </a>

  <script>
    const N = window.NEGOCIO, $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    // Sin WhatsApp, los botones llevan a Instagram
    const ig = N.instagram && `https://instagram.com/${N.instagram}`;
    const wa = N.whatsapp
      ? `https://wa.me/${N.whatsapp}?text=${encodeURIComponent(N.mensajeWhatsapp || `Hola ${N.nombre}, me gustaría pedir cita.`)}`
      : ig;

    document.title = `${N.nombre} · ${N.tipo}`;
    document.documentElement.style.setProperty("--c", N.colorPrincipal);
    document.documentElement.style.setProperty("--d", N.colorOscuro);
    $("hero").style.backgroundImage = `url('${N.imagenCabecera}')`;
    $("demo").hidden = !N.demo;

    $("n-nombre").textContent = N.nombre;
    $("h-tipo").textContent = N.tipo;
    $("h-eslogan").textContent = N.eslogan;
    $("h-desc").textContent = N.descripcion;
    if (N.notaGoogle) $("h-stars").textContent = `★★★★★  ${N.notaGoogle} en Google`;
    $("b-cita").textContent = N.textoBoton || "Pedir cita por WhatsApp";
    $("b-cita2").textContent = N.textoBotonFinal || "Escríbenos por WhatsApp";
    $("t-cta").textContent = N.tituloFinal || "¿Te reservamos hueco?";
    $("t-serv").textContent = $("n-serv").textContent = N.tituloServicios || "Servicios y precios";
    ["b-cita", "b-cita2", "b-wa"].forEach((id) => ($(id).href = wa));
    if (!N.whatsapp) $("b-wa").hidden = true;
    if (N.telefono) {
      $("b-tel").href = $("c-tel").href = `tel:${N.telefono.replace(/\s/g, "")}`;
      $("c-tel").textContent = N.telefono;
    } else {
      $("b-tel").hidden = $("p-tel").hidden = true;
    }
    $("c-dir").textContent = N.direccion;
    $("c-extra").innerHTML = [
      N.email && `<b>Email:</b> <a href="mailto:${esc(N.email)}">${esc(N.email)}</a>`,
      ig && `<b>Instagram:</b> <a target="_blank" href="${esc(ig)}">@${esc(N.instagram)}</a>`,
    ].filter(Boolean).join("<br>");

    $("l-servicios").innerHTML = N.servicios.map((s) =>
      `<div class="card"><div class="row"><span>${esc(s.nombre)}</span><span class="price">${esc(s.precio || "")}</span></div><p>${esc(s.detalle)}</p></div>`).join("");
    $("l-resenas").innerHTML = N.resenas.map((r) =>
      `<div class="card quote">“${esc(r.texto)}”<b>★★★★★ ${esc(r.autor || "Opinión en Google")}</b></div>`).join("");
    $("l-horario").innerHTML = N.horario.map(([d, h]) => `<tr><td>${esc(d)}</td><td>${esc(h)}</td></tr>`).join("");
    $("mapa").src = `https://maps.google.com/maps?q=${encodeURIComponent(N.direccion)}&output=embed`;
    $("pie").textContent = `© ${new Date().getFullYear()} ${N.nombre} · ${N.direccion}`;
  </script>
</body>
</html>
